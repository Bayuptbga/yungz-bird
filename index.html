<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Yungz Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div class="hud hidden" id="hud">0</div>

  <div class="authBar" id="authBar">
    <button class="gearBtn" id="settingsBtn" type="button" title="Pengaturan" aria-label="Pengaturan">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <div class="overlay" id="startScreen">
    <h1>YUNGZ<br>BIRD</h1>
    <div class="leaderboard" id="leaderboard">
      <p class="lbTitle">TOP SKOR</p>
      <ol class="lbList" id="leaderboardList">
        <li class="lbEmpty">Memuat...</li>
      </ol>
      <button class="lbMoreLink" id="lbMoreBtn" type="button">Lihat semua &rsaquo;</button>
    </div>
    <button class="btn" id="startBtn">MULAI</button>
    <button class="btn btnSecondary btnSmall" id="loginBtn" type="button">LOGIN</button>
    <div class="startUserInfo hidden" id="startUserInfo">
      <p class="startUsername" id="startUsername"></p>
      <p class="startUserBest" id="startUserBest">Terbaik: 0</p>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <h1>GAME OVER</h1>
    <p id="scoreLine">Skor: 0</p>
    <p id="bestLine" class="badge">Terbaik: 0</p>
    <p id="saveStatus" class="badge"></p>
    <div class="btnRow">
      <button class="btn" id="retryBtn">COBA LAGI</button>
      <button class="btn btnSecondary" id="homeBtn">HOME</button>
    </div>
  </div>

  <div class="overlay hidden lbFullOverlay" id="lbFullScreen">
    <div class="lbPageHead">
      <button class="lbBackBtn" id="lbBackBtn" type="button">&lsaquo;</button>
      <h1>TOP GLOBAL<br>SCORE</h1>
    </div>
    <ol class="lbFullList" id="lbFullList">
      <li class="lbStatusText" style="width:100%;list-style:none;">Memuat...</li>
    </ol>
  </div>

  <div class="overlay hidden loginOverlay" id="loginScreen">
    <div class="loginCard">
      <button class="loginCloseBtn" id="loginCloseBtn" type="button">&times;</button>
      <h1>LOGIN</h1>
      <input class="nameInput" id="loginUsername" type="text" placeholder="Username" maxlength="16" autocomplete="off">
      <input class="nameInput" id="loginPassword" type="password" placeholder="Password" maxlength="32" autocomplete="off">
      <p id="loginError" class="errorText hidden"></p>
      <button class="btn" id="loginSubmitBtn">MASUK</button>
      <p class="badge">Username baru? Otomatis terdaftar saat login pertama kali.</p>
    </div>
  </div>

  <div class="overlay hidden loginOverlay" id="profileScreen">
    <div class="loginCard profileCard">
      <button class="loginCloseBtn" id="profileCloseBtn" type="button">&times;</button>
      <h1>PROFIL</h1>
      <p class="profileUsername" id="profileUsername"></p>
      <p class="badge" id="profileBest">Skor Terbaik: 0</p>
      <button class="btn btnDanger" id="resetScoreBtn" type="button">RESET SKOR</button>
      <button class="btn btnSecondary" id="profileLogoutBtn">LOGOUT</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
