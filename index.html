<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
  window.__createSupabaseClient = createClient;
</script>

<style>
  :root {
    --bg: #121110;
    --bg-raised: #1c1a18;
    --line: #34302c;
    --cream: #EDE6D6;
    --cream-dim: #8a8478;
    --flash: #FF4500;
    --flash-dim: #7a2405;
    --hud: #8FFF6B;
    --danger: #ff5d5d;
    --mono: 'IBM Plex Mono', monospace;
    --grotesk: 'Archivo', sans-serif;
  }

  * { box-sizing: border-box; }

  #instants-root {
    background: var(--bg);
    color: var(--cream);
    font-family: var(--grotesk);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }

  #instants-root * { -webkit-tap-highlight-color: transparent; }

  .hud-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--hud);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }

  .topbar .wordmark {
    font-family: var(--grotesk);
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.02em;
  }

  .topbar .wordmark span { color: var(--flash); }

  .btn {
    font-family: var(--grotesk);
    font-weight: 600;
    font-size: 14px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--cream);
    padding: 9px 14px;
    border-radius: 3px;
    cursor: pointer;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--flash);
    border-color: var(--flash);
    color: #1a0d05;
  }
  .btn-ghost {
    border-color: transparent;
    color: var(--cream-dim);
  }
  .btn-full { width: 100%; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  input, textarea {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--cream);
    font-family: var(--grotesk);
    font-size: 15px;
    padding: 12px 13px;
    border-radius: 3px;
    outline: none;
  }
  input:focus, textarea:focus { border-color: var(--flash); }

  /* ---- Auth screen ---- */
  .auth-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 24px;
    gap: 18px;
  }
  .auth-hero { margin-bottom: 8px; }
  .auth-hero .hud-label { display: block; margin-bottom: 10px; }
  .auth-hero h1 {
    font-size: 30px;
    line-height: 1.05;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .auth-hero p {
    color: var(--cream-dim);
    font-size: 14px;
    margin-top: 10px;
    line-height: 1.5;
  }
  .auth-field { display: flex; flex-direction: column; gap: 6px; }
  .auth-field label { font-family: var(--mono); font-size: 11px; color: var(--cream-dim); }
  .auth-switch { text-align: center; font-size: 13px; color: var(--cream-dim); }
  .auth-switch button { background: none; border: none; color: var(--hud); font-family: var(--mono); font-size: 13px; cursor: pointer; }
  .auth-error { color: var(--danger); font-size: 13px; font-family: var(--mono); }

  /* ---- Tabs / nav ---- */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    flex: 1;
    padding: 13px 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--cream-dim);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }
  .tab.active { color: var(--hud); border-bottom-color: var(--hud); }
  .tab .count { color: var(--flash); }

  .screen { flex: 1; overflow-y: auto; padding-bottom: 80px; }

  /* ---- Camera ---- */
  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    background: #000;
    overflow: hidden;
  }
  .camera-wrap video, .camera-wrap canvas, .camera-wrap img.captured {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .camera-hud {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 11px; color: var(--hud);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .rec-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--flash); margin-right: 5px;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .caption-bar { padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--bg-raised); }
  .caption-bar input { background: transparent; border: none; font-size: 15px; padding: 4px 0; }
  .caption-bar .hint { font-family: var(--mono); font-size: 10px; color: var(--cream-dim); margin-top: 4px; }

  .capture-row {
    display: flex; align-items: center; justify-content: center; gap: 26px;
    padding: 20px;
  }
  .shutter-btn {
    width: 66px; height: 66px; border-radius: 50%;
    background: var(--flash);
    border: 4px solid var(--cream);
    cursor: pointer;
  }
  .shutter-btn:disabled { background: var(--flash-dim); border-color: var(--line); cursor: not-allowed; }
  .audience-toggle { display: flex; gap: 8px; padding: 0 14px 14px; }
  .audience-toggle button {
    flex: 1; font-family: var(--mono); font-size: 11px; padding: 9px 6px;
    background: var(--bg-raised); border: 1px solid var(--line); color: var(--cream-dim); border-radius: 3px;
  }
  .audience-toggle button.active { border-color: var(--hud); color: var(--hud); }

  /* ---- Feed ---- */
  .feed-empty {
    padding: 60px 24px; text-align: center; color: var(--cream-dim);
  }
  .feed-empty .hud-label { display: block; margin-bottom: 8px; }

  .instant-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .instant-row .thumb {
    width: 52px; height: 52px; border-radius: 3px; object-fit: cover;
    border: 1px solid var(--line); filter: blur(8px) brightness(0.7);
  }
  .instant-row.viewed .thumb { filter: none; opacity: 0.5; }
  .instant-row .meta { flex: 1; min-width: 0; }
  .instant-row .who { font-weight: 600; font-size: 14px; }
  .instant-row .cap { font-size: 12px; color: var(--cream-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .instant-row .when { font-family: var(--mono); font-size: 10px; color: var(--cream-dim); }
  .instant-row .badge {
    font-family: var(--mono); font-size: 10px; color: var(--flash); border: 1px solid var(--flash-dim);
    padding: 2px 6px; border-radius: 2px;
  }

  /* ---- Viewer (view-once) ---- */
  .viewer-overlay {
    position: fixed; inset: 0; background: #000; z-index: 50;
    display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto;
  }
  .viewer-overlay img { flex: 1; width: 100%; object-fit: contain; background: #000; }
  .viewer-top { display: flex; justify-content: space-between; align-items: center; padding: 14px; }
  .viewer-caption { padding: 14px; font-size: 15px; }
  .viewer-reactions { display: flex; gap: 8px; padding: 10px 14px 20px; flex-wrap: wrap; }
  .emoji-btn { font-size: 20px; background: var(--bg-raised); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; cursor: pointer; }
  .privacy-shield {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); color: var(--cream-dim); font-size: 13px; text-align: center; padding: 24px;
  }

  /* ---- Friends ---- */
  .friend-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .friend-row .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--bg-raised);
    display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 13px; color: var(--hud);
    border: 1px solid var(--line);
  }
  .friend-row .uname { flex: 1; font-size: 14px; font-weight: 600; }
  .friend-row .status { font-family: var(--mono); font-size: 10px; color: var(--cream-dim); }
  .add-friend-bar { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .add-friend-bar input { flex: 1; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
    display: flex; border-top: 1px solid var(--line); background: var(--bg);
  }
  .nav-btn {
    flex: 1; padding: 13px 0; background: none; border: none; color: var(--cream-dim);
    font-family: var(--mono); font-size: 11px; cursor: pointer;
  }
  .nav-btn.active { color: var(--flash); }

  .toast {
    position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%);
    background: var(--bg-raised); border: 1px solid var(--hud); color: var(--hud);
    font-family: var(--mono); font-size: 12px; padding: 9px 16px; border-radius: 3px;
    z-index: 60;
  }

  .center-loading { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--cream-dim); font-family: var(--mono); font-size: 13px; }
</style>

<div id="instants-root"></div>

<script>
(function () {
  const SUPABASE_URL = 'https://kuocqeaolhinzvrrdfti.supabase.co';
  const SUPABASE_KEY = 'sb_publishable__eHAiIrB-pERNeb42dJpqg_yE6pcSyv';

  const root = document.getElementById('instants-root');
  let supabase = null;
  let state = {
    booting: true,
    user: null,       // supabase auth user
    profile: null,     // { id, username, display_name }
    authMode: 'signin', // 'signin' | 'signup'
    authError: '',
    authLoading: false,
    tab: 'camera',      // camera | feed | friends
    stream: null,
    capturedImage: null, // base64
    caption: '',
    audience: 'mutuals', // mutuals | close_friends
    posting: false,
    feed: [],           // unviewed instants from mutuals
    sentInstants: [],    // my own posted instants (active)
    friends: [],         // list of mutual usernames
    pendingOut: [],       // people I follow but who don't follow back yet
    addFriendInput: '',
    friendError: '',
    viewerInstant: null, // instant currently open full-screen
    viewerReactions: [],
    toast: '',
    shielded: false,
  };

  function setState(patch) {
    Object.assign(state, patch);
    render();
  }

  function showToast(msg) {
    setState({ toast: msg });
    setTimeout(() => setState({ toast: '' }), 2200);
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function timeAgo(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'now';
    if (mins < 60) return mins + 'm';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h';
    return Math.floor(hrs / 24) + 'd';
  }

  function timeLeft(iso) {
    const diff = new Date(iso).getTime() - Date.now();
    if (diff <= 0) return 'expired';
    const hrs = Math.floor(diff / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    return hrs + 'h ' + mins + 'm left';
  }

  // ---------------- INIT ----------------
  async function init() {
    supabase = window.__createSupabaseClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false }
    });
    const { data } = await supabase.auth.getUser();
    if (data && data.user) {
      state.user = data.user;
      await loadProfile();
    }
    state.booting = false;
    render();
    setupPrivacyShield();
    if (state.user) startPolling();
  }

  function setupPrivacyShield() {
    // Best-effort deterrent: web pages cannot truly block OS-level screenshots.
    // We blur/blank content when the tab loses focus or visibility changes.
    document.addEventListener('visibilitychange', () => {
      setState({ shielded: document.hidden && !!state.viewerInstant });
    });
    window.addEventListener('blur', () => {
      if (state.viewerInstant) setState({ shielded: true });
    });
    window.addEventListener('focus', () => {
      if (state.shielded) setState({ shielded: false });
    });
    document.addEventListener('contextmenu', (e) => {
      if (root.contains(e.target)) e.preventDefault();
    });
    document.addEventListener('keydown', (e) => {
      // Deter the most common screenshot/devtools shortcuts (best-effort only)
      if ((e.key === 'PrintScreen') || (e.metaKey && e.shiftKey && ['3','4','5'].includes(e.key))) {
        setState({ shielded: true });
        setTimeout(() => setState({ shielded: false }), 1200);
      }
    });
  }

  let pollHandle = null;
  function startPolling() {
    if (pollHandle) clearInterval(pollHandle);
    loadFeed();
    loadFriends();
    loadSent();
    pollHandle = setInterval(() => {
      loadFeed();
      loadSent();
    }, 15000);
  }

  // ---------------- AUTH ----------------
  async function loadProfile() {
    const { data } = await supabase.from('profiles').select('*').eq('id', state.user.id).maybeSingle();
    state.profile = data;
  }

  async function handleAuthSubmit(username, email, password) {
    setState({ authLoading: true, authError: '' });
    try {
      if (state.authMode === 'signup') {
        if (!username || username.length < 3) throw new Error('Username minimal 3 karakter');
        const { data, error } = await supabase.auth.signUp({
          email, password,
          options: { data: { username: username.toLowerCase(), display_name: username } }
        });
        if (error) throw error;
        state.user = data.user;
        if (!data.session) {
          // email confirmation might be required
          const { data: signInData, error: signInErr } = await supabase.auth.signInWithPassword({ email, password });
          if (!signInErr) state.user = signInData.user;
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        state.user = data.user;
      }
      await loadProfile();
      setState({ authLoading: false });
      startPolling();
    } catch (e) {
      setState({ authLoading: false, authError: e.message || 'Terjadi kesalahan' });
    }
  }

  async function handleSignOut() {
    if (pollHandle) clearInterval(pollHandle);
    stopCamera();
    await supabase.auth.signOut();
    setState({ user: null, profile: null, feed: [], sentInstants: [], friends: [], tab: 'camera' });
  }

  // ---------------- FRIENDS ----------------
  async function loadFriends() {
    const uid = state.user.id;
    const { data: following } = await supabase.from('follows').select('followee_id, profiles!follows_followee_id_fkey(username, display_name)').eq('follower_id', uid);
    const { data: followers } = await supabase.from('follows').select('follower_id').eq('followee_id', uid);
    const followerIds = new Set((followers || []).map(f => f.follower_id));
    const mutuals = [];
    const pendingOut = [];
    (following || []).forEach(f => {
      const entry = { id: f.followee_id, username: f.profiles?.username, display_name: f.profiles?.display_name };
      if (followerIds.has(f.followee_id)) mutuals.push(entry);
      else pendingOut.push(entry);
    });
    setState({ friends: mutuals, pendingOut });
  }

  async function handleAddFriend() {
    const uname = state.addFriendInput.trim().toLowerCase();
    if (!uname) return;
    if (uname === state.profile.username) {
      setState({ friendError: 'Tidak bisa menambah diri sendiri' });
      return;
    }
    const { data: target, error: findErr } = await supabase.from('profiles').select('id, username').eq('username', uname).maybeSingle();
    if (findErr || !target) {
      setState({ friendError: 'Username tidak ditemukan' });
      return;
    }
    const { error } = await supabase.from('follows').insert({ follower_id: state.user.id, followee_id: target.id });
    if (error && !error.message.includes('duplicate')) {
      setState({ friendError: error.message });
      return;
    }
    setState({ addFriendInput: '', friendError: '' });
    showToast('Ditambahkan. Mutual jika mereka follow balik.');
    loadFriends();
  }

  // ---------------- CAMERA ----------------
  let cameraStarting = false;
  async function startCamera() {
    if (cameraStarting || state.stream) return;
    cameraStarting = true;
    stopCamera();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      state.stream = stream;
      render();
      const video = document.getElementById('camera-video');
      if (video) { video.srcObject = stream; await video.play().catch(() => {}); }
    } catch (e) {
      showToast('Tidak bisa akses kamera: ' + e.message);
    }
    cameraStarting = false;
  }

  function stopCamera() {
    if (state.stream) {
      state.stream.getTracks().forEach(t => t.stop());
      state.stream = null;
    }
  }

  function captureFrame() {
    const video = document.getElementById('camera-video');
    if (!video || !video.videoWidth) return;
    const canvas = document.createElement('canvas');
    const maxW = 720;
    const scale = Math.min(1, maxW / video.videoWidth);
    canvas.width = video.videoWidth * scale;
    canvas.height = video.videoHeight * scale;
    const ctx = canvas.getContext('2d');
    // mirror for selfie-style feel
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.62);
    stopCamera();
    setState({ capturedImage: dataUrl });
  }

  function retake() {
    setState({ capturedImage: null });
    startCamera();
  }

  async function handlePost() {
    if (!state.capturedImage || !state.caption.trim()) {
      showToast('Tulis caption dulu sebelum kirim');
      return;
    }
    setState({ posting: true });
    const { error } = await supabase.from('instants').insert({
      author_id: state.user.id,
      caption: state.caption.trim(),
      image_data: state.capturedImage,
      audience: state.audience,
    });
    setState({ posting: false });
    if (error) {
      showToast('Gagal mengirim: ' + error.message);
      return;
    }
    setState({ capturedImage: null, caption: '', tab: 'feed' });
    showToast('Instant terkirim! Hilang dalam 24 jam.');
    loadSent();
  }

  // ---------------- FEED ----------------
  async function loadFeed() {
    if (!state.profile) return;
    const nowIso = new Date().toISOString();
    const { data, error } = await supabase
      .from('instants')
      .select('id, caption, image_data, created_at, expires_at, audience, author_id, profiles!instants_author_id_fkey(username, display_name)')
      .neq('author_id', state.user.id)
      .gt('expires_at', nowIso)
      .order('created_at', { ascending: false });
    if (error) return;
    const { data: viewedRows } = await supabase.from('instant_views').select('instant_id').eq('viewer_id', state.user.id);
    const viewedSet = new Set((viewedRows || []).map(v => v.instant_id));
    const feed = (data || []).map(row => ({ ...row, viewed: viewedSet.has(row.id) }));
    setState({ feed });
  }

  async function loadSent() {
    const nowIso = new Date().toISOString();
    const { data } = await supabase
      .from('instants')
      .select('id, caption, image_data, created_at, expires_at, audience')
      .eq('author_id', state.user.id)
      .gt('expires_at', nowIso)
      .order('created_at', { ascending: false });
    setState({ sentInstants: data || [] });
  }

  async function openInstant(instant) {
    if (instant.viewed) {
      showToast('Instant ini sudah kamu lihat sebelumnya');
      return;
    }
    setState({ viewerInstant: instant, viewerReactions: [] });
    if (instant.author_id && instant.author_id !== state.user.id) {
      await supabase.from('instant_views').insert({ instant_id: instant.id, viewer_id: state.user.id });
      loadFeed();
    }
  }

  function closeViewer() {
    setState({ viewerInstant: null, shielded: false });
  }

  async function sendReaction(kind, content) {
    if (!state.viewerInstant) return;
    await supabase.from('instant_reactions').insert({
      instant_id: state.viewerInstant.id,
      responder_id: state.user.id,
      kind, content
    });
    showToast(kind === 'emoji' ? 'Reaksi terkirim' : 'Balasan terkirim');
  }

  // ---------------- RENDER ----------------
  function render() {
    if (state.booting) {
      root.innerHTML = `<div class="center-loading">MEMUAT&hellip;</div>`;
      return;
    }
    if (!state.user || !state.profile) {
      renderAuth();
      return;
    }
    renderApp();
    attachAppHandlers();
  }

  function renderAuth() {
    const isSignup = state.authMode === 'signup';
    root.innerHTML = `
      <div class="auth-screen">
        <div class="auth-hero">
          <span class="hud-label">● REC &middot; UNFILTERED</span>
          <h1>Instants,<br/>versi kamu.</h1>
          <p>Bagikan momen spontan ke teman dekat. Tanpa edit, sekali lihat, hilang dalam 24 jam.</p>
        </div>
        <div class="auth-field" ${isSignup ? '' : 'style="display:none"'}>
          <label>USERNAME</label>
          <input id="f-username" type="text" placeholder="cth: rara.p" autocomplete="off" />
        </div>
        <div class="auth-field">
          <label>EMAIL</label>
          <input id="f-email" type="email" placeholder="kamu@email.com" autocomplete="email" />
        </div>
        <div class="auth-field">
          <label>PASSWORD</label>
          <input id="f-password" type="password" placeholder="Minimal 6 karakter" autocomplete="current-password" />
        </div>
        ${state.authError ? `<div class="auth-error">${esc(state.authError)}</div>` : ''}
        <button class="btn btn-primary btn-full" id="auth-submit" ${state.authLoading ? 'disabled' : ''}>
          ${state.authLoading ? 'MEMPROSES...' : (isSignup ? 'Buat akun' : 'Masuk')}
        </button>
        <div class="auth-switch">
          ${isSignup ? 'Sudah punya akun?' : 'Belum punya akun?'}
          <button id="auth-toggle">${isSignup ? 'Masuk' : 'Daftar'}</button>
        </div>
      </div>
    `;
    document.getElementById('auth-toggle').onclick = () => setState({ authMode: isSignup ? 'signin' : 'signup', authError: '' });
    document.getElementById('auth-submit').onclick = () => {
      const username = document.getElementById('f-username') ? document.getElementById('f-username').value.trim() : '';
      const email = document.getElementById('f-email').value.trim();
      const password = document.getElementById('f-password').value;
      if (!email || !password) { setState({ authError: 'Isi email dan password' }); return; }
      handleAuthSubmit(username, email, password);
    };
  }

  function renderApp() {
    const feedUnviewedCount = state.feed.filter(f => !f.viewed).length;
    root.innerHTML = `
      <div class="topbar">
        <div class="wordmark">instants<span>.</span></div>
        <button class="btn btn-ghost" id="signout-btn">@${esc(state.profile.username)} &middot; keluar</button>
      </div>
      <div class="tabs">
        <button class="tab ${state.tab === 'camera' ? 'active' : ''}" data-tab="camera">KAMERA</button>
        <button class="tab ${state.tab === 'feed' ? 'active' : ''}" data-tab="feed">FEED ${feedUnviewedCount ? `<span class="count">(${feedUnviewedCount})</span>` : ''}</button>
        <button class="tab ${state.tab === 'friends' ? 'active' : ''}" data-tab="friends">TEMAN</button>
      </div>
      <div class="screen">
        ${state.tab === 'camera' ? renderCamera() : ''}
        ${state.tab === 'feed' ? renderFeed() : ''}
        ${state.tab === 'friends' ? renderFriends() : ''}
      </div>
      ${state.viewerInstant ? renderViewer() : ''}
      ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
    `;
  }

  function renderCamera() {
    if (state.capturedImage) {
      return `
        <div class="camera-wrap">
          <img class="captured" src="${state.capturedImage}" />
          <div class="camera-hud"><span>PRATINJAU</span><span>${esc(state.audience === 'mutuals' ? 'MUTUAL' : 'TEMAN DEKAT')}</span></div>
        </div>
        <div class="caption-bar">
          <input id="caption-input" type="text" placeholder="Tulis caption sebelum kirim..." value="${esc(state.caption)}" maxlength="140" />
          <div class="hint">Wajib diisi &middot; tidak bisa diedit lagi setelah dikirim</div>
        </div>
        <div class="audience-toggle">
          <button data-aud="mutuals" class="${state.audience === 'mutuals' ? 'active' : ''}">MUTUAL FOLLOWERS</button>
          <button data-aud="close_friends" class="${state.audience === 'close_friends' ? 'active' : ''}">TEMAN DEKAT</button>
        </div>
        <div class="capture-row">
          <button class="btn" id="retake-btn">Ambil ulang</button>
          <button class="btn btn-primary" id="send-btn" ${state.posting ? 'disabled' : ''}>${state.posting ? 'Mengirim...' : 'Kirim Instant'}</button>
        </div>
      `;
    }
    return `
      <div class="camera-wrap">
        ${state.stream ? `<video id="camera-video" autoplay playsinline muted></video>` : `<div class="center-loading" style="height:100%">Menyiapkan kamera&hellip;</div>`}
        <div class="camera-hud"><span><span class="rec-dot"></span>LIVE</span><span>${new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</span></div>
      </div>
      <div class="caption-bar">
        <div class="hint">Tanpa filter, tanpa edit &mdash; ambil apa adanya. Kamera tidak bisa upload dari galeri.</div>
      </div>
      <div class="capture-row">
        <button class="shutter-btn" id="shutter-btn" ${!state.stream ? 'disabled' : ''}></button>
      </div>
    `;
  }

  function renderFeed() {
    if (!state.feed.length) {
      return `<div class="feed-empty"><span class="hud-label">FEED KOSONG</span>Belum ada Instant dari teman mutual kamu. Ajak mereka lewat tab Teman.</div>`;
    }
    return state.feed.map(item => `
      <div class="instant-row ${item.viewed ? 'viewed' : ''}" data-open="${item.id}">
        <img class="thumb" src="${item.image_data}" />
        <div class="meta">
          <div class="who">@${esc(item.profiles?.username || 'user')}</div>
          <div class="cap">${esc(item.caption)}</div>
          <div class="when">${timeAgo(item.created_at)} lalu &middot; ${timeLeft(item.expires_at)}</div>
        </div>
        ${!item.viewed ? '<span class="badge">BARU</span>' : ''}
      </div>
    `).join('');
  }

  function renderFriends() {
    return `
      <div class="add-friend-bar">
        <input id="add-friend-input" type="text" placeholder="Tambah teman via username" value="${esc(state.addFriendInput)}" />
        <button class="btn btn-primary" id="add-friend-btn">Tambah</button>
      </div>
      ${state.friendError ? `<div class="auth-error" style="padding:0 16px 10px">${esc(state.friendError)}</div>` : ''}
      ${state.friends.length ? state.friends.map(f => `
        <div class="friend-row">
          <div class="avatar">${esc((f.username || '?')[0].toUpperCase())}</div>
          <div class="uname">@${esc(f.username)}</div>
          <div class="status">MUTUAL</div>
        </div>
      `).join('') : `<div class="feed-empty"><span class="hud-label">BELUM ADA TEMAN</span>Tambahkan username teman untuk mulai berbagi Instant.</div>`}
      ${state.pendingOut.length ? `
        <div class="hud-label" style="padding:14px 16px 4px; display:block">MENUNGGU FOLLOW BALIK</div>
        ${state.pendingOut.map(f => `
          <div class="friend-row">
            <div class="avatar">${esc((f.username || '?')[0].toUpperCase())}</div>
            <div class="uname">@${esc(f.username)}</div>
            <div class="status">PENDING</div>
          </div>
        `).join('')}
      ` : ''}
      <div style="padding:14px 16px; font-family:var(--mono); font-size:11px; color:var(--cream-dim); line-height:1.6">
        Kamu tampil sebagai <strong style="color:var(--hud)">@${esc(state.profile.username)}</strong>. Bagikan username ini supaya teman bisa follow balik dan jadi mutual.
      </div>
    `;
  }

  function renderViewer() {
    const it = state.viewerInstant;
    return `
      <div class="viewer-overlay">
        <div class="viewer-top">
          <span class="hud-label">@${esc(it.profiles ? it.profiles.username : state.profile.username)}</span>
          <button class="btn btn-ghost" id="close-viewer">Tutup ✕</button>
        </div>
        ${state.shielded ? `<div class="privacy-shield">KONTEN DISEMBUNYIKAN<br/>saat aplikasi tidak aktif</div>` : `<img src="${it.image_data}" />`}
        <div class="viewer-caption">${esc(it.caption)}</div>
        <div class="viewer-reactions">
          ${['❤️','😂','😮','🔥','👀'].map(e => `<button class="emoji-btn" data-emoji="${e}">${e}</button>`).join('')}
        </div>
      </div>
    `;
  }

  function attachAppHandlers() {
    const signoutBtn = document.getElementById('signout-btn');
    if (signoutBtn) signoutBtn.onclick = handleSignOut;

    root.querySelectorAll('.tab').forEach(el => {
      el.onclick = () => {
        const tab = el.getAttribute('data-tab');
        if (tab === 'camera' && !state.capturedImage) {
          setState({ tab });
          startCamera();
        } else {
          stopCamera();
          setState({ tab });
          if (tab === 'feed') loadFeed();
          if (tab === 'friends') loadFriends();
        }
      };
    });

    if (state.tab === 'camera' && !state.stream && !state.capturedImage) {
      startCamera();
    }

    const shutterBtn = document.getElementById('shutter-btn');
    if (shutterBtn) shutterBtn.onclick = captureFrame;

    const captionInput = document.getElementById('caption-input');
    if (captionInput) {
      captionInput.oninput = (e) => { state.caption = e.target.value; };
      captionInput.focus();
    }

    root.querySelectorAll('[data-aud]').forEach(el => {
      el.onclick = () => setState({ audience: el.getAttribute('data-aud') });
    });

    const retakeBtn = document.getElementById('retake-btn');
    if (retakeBtn) retakeBtn.onclick = retake;
    const sendBtn = document.getElementById('send-btn');
    if (sendBtn) sendBtn.onclick = handlePost;

    root.querySelectorAll('[data-open]').forEach(el => {
      el.onclick = () => {
        const id = el.getAttribute('data-open');
        const item = state.feed.find(f => f.id === id);
        if (item) openInstant(item);
      };
    });

    const closeBtn = document.getElementById('close-viewer');
    if (closeBtn) closeBtn.onclick = closeViewer;

    root.querySelectorAll('.emoji-btn').forEach(el => {
      el.onclick = () => sendReaction('emoji', el.getAttribute('data-emoji'));
    });

    const addFriendInput = document.getElementById('add-friend-input');
    if (addFriendInput) {
      addFriendInput.oninput = (e) => { state.addFriendInput = e.target.value; };
    }
    const addFriendBtn = document.getElementById('add-friend-btn');
    if (addFriendBtn) addFriendBtn.onclick = handleAddFriend;
  }

  init();
})();
</script>
