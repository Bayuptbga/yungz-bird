<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yungz Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div class="hud" id="hud">0</div>

  <div class="overlay" id="startScreen">
    <h1>YUNGZ<br>BIRD</h1>
    <p>Ketuk layar, klik, atau<br>tekan SPASI untuk terbang.<br>Hindari pipa!</p>
    <button class="btn" id="startBtn">MULAI</button>
  </div>

  <div class="overlay hidden" id="overScreen">
    <h1>GAME OVER</h1>
    <p id="scoreLine">Skor: 0</p>
    <p id="bestLine" class="badge">Terbaik: 0</p>
    <button class="btn" id="retryBtn">COBA LAGI</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
